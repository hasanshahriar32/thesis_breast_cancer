openapi: 3.0.0
info:
  title: Hospital Backend API
  description: API for a single hospital node in a federated learning network for breast cancer detection.
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com

servers:
  - url: http://localhost:3000/api
    description: Development server

tags:
  - name: Hospital
    description: Operations related to hospital information and status
  - name: Patients
    description: Patient data management and feature extraction
  - name: Models
    description: Local and global model training and management
  - name: Blockchain
    description: Interaction with the Ethereum smart contract
  - name: IPFS
    description: Interaction with the IPFS network for data storage

paths:
  /hospital/info:
    get:
      tags: [Hospital]
      summary: Get hospital information
      description: Retrieve detailed information about this hospital node.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HospitalInfoResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /hospital/stats:
    get:
      tags: [Hospital]
      summary: Get hospital statistics
      description: Retrieve patient and system statistics for this hospital.
      responses:
        '200':
          description: Successful response
        '500':
          $ref: '#/components/responses/InternalError'

  /patients/upload:
    post:
      tags: [Patients]
      summary: Upload patient data
      description: Upload medical images (X-ray, Ultrasound, Histopathology) and metadata for a new patient.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                patient_metadata:
                  type: string
                  format: json
                  description: JSON string containing patient metadata conforming to PatientMetadata schema.
                  example: '{"patientId": "P123456", "age": 45, "diagnosis": "malignant"}'
                xray:
                  type: string
                  format: binary
                histopathology:
                  type: string
                  format: binary
                ultrasound:
                  type: string
                  format: binary
      responses:
        '201':
          description: Patient data uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  patient_id:
                    type: string
                    example: "7dfd5f6f-3ef8-4325-bd85-2bb53ffb1463"
                  metadata:
                    $ref: '#/components/schemas/PatientMetadata'
                  file_urls:
                    type: object
                    properties:
                      xray:
                        $ref: '#/components/schemas/BlobStorageFile'
                      histopathology:
                        $ref: '#/components/schemas/BlobStorageFile'
                      ultrasound:
                        $ref: '#/components/schemas/BlobStorageFile'
                  features_extracted:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: "Patient data uploaded and processed successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /patients/list:
    get:
      tags: [Patients]
      summary: List patients
      description: Get a paginated list of patients for this hospital.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Successful response
        '500':
          $ref: '#/components/responses/InternalError'

  /patients/{id}:
    get:
      tags: [Patients]
      summary: Get patient details
      description: Retrieve full details for a specific patient by their ID.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /ipfs/upload-patient/{patientId}:
    post:
      tags: [IPFS]
      summary: Upload patient images to IPFS
      description: Upload encrypted patient images (xray, histopathology, ultrasound) to IPFS and store CIDs.
      parameters:
        - in: path
          name: patientId
          required: true
          schema:
            type: string
          description: The patient ID (e.g., P456789)
      responses:
        '200':
          description: Images uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  patientId:
                    type: string
                  ipfsCids:
                    type: object
                    properties:
                      xray:
                        type: string
                      histopathology:
                        type: string
                      ultrasound:
                        type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /models/extract-features/{patientId}:
    post:
      tags: [Models]
      summary: Extract features for a patient
      description: Extract AI features from patient's medical images using EfficientNetB0.
      parameters:
        - in: path
          name: patientId
          required: true
          schema:
            type: string
          description: The patient ID (e.g., P456789)
      responses:
        '200':
          description: Features extracted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  patientId:
                    type: string
                  features:
                    type: object
                    properties:
                      total_dimensions:
                        type: integer
                      xray_dimensions:
                        type: integer
                      histo_dimensions:
                        type: integer
                      ultra_dimensions:
                        type: integer
                  abnormality_detection:
                    type: object
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /models/train-local:
    post:
      tags: [Models]
      summary: Train local model
      description: Start a training job for the local model using the hospital's patient data.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                epochs:
                  type: integer
                  default: 5
                batch_size:
                  type: integer
                  default: 32
      responses:
        '200':
          description: Training started successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /models/submit-to-chain:
    post:
      tags: [Models]
      summary: Submit model to blockchain
      description: Encrypt, upload to IPFS, and submit the latest local model's weights to the smart contract.
      responses:
        '200':
          description: Model submitted successfully
        '500':
          $ref: '#/components/responses/InternalError'

  /blockchain/register-hospital:
    post:
      tags: [Blockchain]
      summary: Register hospital
      description: Register this hospital node on the blockchain smart contract.
      responses:
        '200':
          description: Hospital registered
        '500':
          $ref: '#/components/responses/InternalError'

  /ipfs/status:
    get:
      tags: [IPFS]
      summary: Get IPFS node status
      description: Check the connection and status of the configured IPFS node.
      responses:
        '200':
          description: IPFS node is connected
        '500':
          $ref: '#/components/responses/InternalError'

components:
  schemas:
    HospitalInfo:
      type: object
      properties:
        hospital_id:
          type: string
        hospital_name:
          type: string
        capabilities:
          type: object
          properties:
            modalities:
              type: array
              items:
                type: string
            encryption_enabled:
              type: boolean
            ipfs_enabled:
              type: boolean
            blockchain_enabled:
              type: boolean

    HospitalInfoResponse:
      type: object
      properties:
        success:
          type: boolean
        hospital:
          $ref: '#/components/schemas/HospitalInfo'

    PatientMetadata:
      type: object
      properties:
        patientId:
          type: string
          description: Unique identifier for the patient
          example: "P123456"
        age:
          type: number
          description: Patient's age in years
          example: 45
        diagnosis:
          type: string
          description: Medical diagnosis result
          enum: ["malignant", "benign"]
          example: "malignant"
      required:
        - patientId
        - age
        - diagnosis

    BlobStorageFile:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Public URL to access the file on Vercel Blob Storage
          example: "https://ym58rk9cpdeglu7z.public.blob.vercel-storage.com/patients/7dfd5f6f-3ef8-4325-bd85-2bb53ffb1463/xray-1762836125293-gjiLyMkCuh6lFa2lI6vkHR2EfRTqEL.encrypted"
        downloadUrl:
          type: string
          format: uri
          description: Download URL with download parameter
          example: "https://ym58rk9cpdeglu7z.public.blob.vercel-storage.com/patients/7dfd5f6f-3ef8-4325-bd85-2bb53ffb1463/xray-1762836125293-gjiLyMkCuh6lFa2lI6vkHR2EfRTqEL.encrypted?download=1"
        encrypted:
          type: boolean
          description: Whether the file is encrypted
          example: true
        size:
          type: integer
          description: File size in bytes
          example: 174469
        checksum:
          type: string
          description: SHA-256 checksum of the file
          example: "163d481189f2883161ce31acffbe371c56c0853eac22270ae994d3fbc4ff5074"

  responses:
    NotFound:
      description: The specified resource was not found.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    BadRequest:
      description: The request was malformed or invalid.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    InternalError:
      description: An unexpected error occurred on the server.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              message:
                type: string
